[versions]
#compose versions
composeBom = "2026.09.00"
compose-plugin = "1.12.2"
compose-runtime = "1.12.1"
activityCompose = "1.13.0"
lifecycleViewmodelCompose = "2.11.0"
#room versions
room = "2.8.5"
#core fragment versions
fragment-core-ktx = "1.9.1"
#core android versions
androidx-core-ktx = "1.19.1"
androidx-core-appcompat = "1.8.0"
androidx-core-view-material = "1.14.0"
androidx-core-activity = "1.13.0"
androidx-core-view-constraint = "2.2.2"
androidx-core-view-animation = "1.0.0"

#KSP Special Sign
ksp = "2.3.6"

#Kotlin Version Sign
kotlin = "2.4.21"

#AGP Special Sign
agp = "9.4.1"



[libraries]
#compose library
compose-bom = { module = "androidx.compose:compose-bom", version.ref = "composeBom" }
compose-runtime = { group = "androidx.compose.runtime", name = "runtime", version.ref = "compose-runtime" }
compose-foundation = { module = "androidx.compose.foundation:foundation" }
compose-material3 = { module = "androidx.compose.material3:material3" }
compose-extended-icons = { module = "androidx.compose.material:material-icons-extended" }
compose-ui = { module = "androidx.compose.ui:ui" }
compose-connect-activity  = { module = "androidx.activity:activity-compose", version.ref = "activityCompose" }
compose-connect-viewmodel = { module = "androidx.lifecycle:lifecycle-viewmodel-compose", version.ref = "lifecycleViewmodelCompose" }
#room library
room-runtime = { module = "androidx.room:room-runtime", version.ref = "room" }
room-ktx = { module = "androidx.room:room-ktx", version.ref = "room" }
room-compiler = { group = "androidx.room", name = "room-compiler", version.ref = "room" }
#core fragment library
fragment-core-ktx = { group = "androidx.fragment", name = "fragment-ktx", version.ref = "fragment-core-ktx" }
#core android library
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "androidx-core-ktx" }
androidx-core-appcompat = { group = "androidx.appcompat", name = "appcompat", version.ref = "androidx-core-appcompat" }
androidx-core-activity = { group = "androidx.activity", name = "activity", version.ref = "androidx-core-activity" }
androidx-core-view-animation = { group = "androidx.core", name = "core-animation", version.ref = "androidx-core-view-animation" }
androidx-core-view-constraint = { group = "androidx.constraintlayout", name = "constraintlayout", version.ref = "androidx-core-view-constraint" }
androidx-core-view-material = { group = "com.google.android.material", name = "material", version.ref = "androidx-core-view-material" }



[plugins]
#compose plugin
jetbrainsCompose = { id = "org.jetbrains.compose", version.ref = "compose-plugin" }
compose-compiler = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
#core android plugins
ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
android-application = { id = "com.android.application", version.ref = "agp" }





